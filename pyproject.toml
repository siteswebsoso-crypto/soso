[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Assistant personnel façon J.A.R.V.I.S., propulsé par Claude"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.12"]

[project.optional-dependencies]
# Voix : micro + synthèse vocale
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.14"]
# Bureau : presse-papiers, notifications, captures d'écran, infos système
desktop = ["pyperclip>=1.8", "plyer>=2.1", "Pillow>=10", "psutil>=5.9"]
all = ["jarvis-assistant[voice,desktop]"]
dev = ["pytest>=8"]
# Jarvis Junior (Mac) : fenêtre native, micro, reconnaissance vocale locale
junior = [
    "pywebview>=5",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
packages = ["jarvis", "junior"]

[tool.setuptools.package-data]
jarvis = ["recettes/*.md"]
junior = ["ui/*", "assets/*"]
